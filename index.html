<script>

const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,G;function rs(){const a=innerWidth/innerHeight;H=720;W=Math.round(Math.min(1700,Math.max(1000,H*a)));c.width=W;c.height=H;G=H*0.78;const k=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*k+'px';c.style.height=H*k+'px';c.style.left=(innerWidth-W*k)/2+'px';c.style.top=(innerHeight-H*k)/2+'px'}

const AC=new (window.AudioContext||window.webkitAudioContext)();
function tone(f,d,t='square',v=.08){const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}
function scream(){const n=AC.sampleRate*1.4,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;g.gain.value=1.2;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();for(let i=0;i<8;i++)setTimeout(()=>tone(300+Math.random()*900,.12,'sawtooth',.25),i*120)}
const S=50; // cube size
let tk=null,tkNext=2500+Math.random()*2500,pz=[],pzX=0,got=0,missed=0,chef=false,chefX=-300,fullT=0,gap=200,deathBy='bot',stepT=0,battery=100,light=true,mk=document.createElement('canvas'),mx=mk.getContext('2d');
if(localStorage.nsdResetV!=='2'){localStorage.nsdNight=1;localStorage.nsdResetV='2'}

function reset(){p={y:G-S,vy:0,rot:0,ground:true};obs=[];speed=7;dist=0;dead=false;scareT=0;night=+localStorage.nsdNight||1;if(night>5){night=1;localStorage.nsdNight=1}spawnX=W+300;battery=100;light=true;gap=200;deathBy='bot';tk=null;tkNext=nextTk(true);gd=null;gRoll=0;pz=[];pzX=W+500;got=0;missed=0;chef=false;chefX=-300;fullT=0}

 2:{spk:2,blk2:.3, w:[.40,.30,.08,.12,.10],gap:1.05,pz:.3, tk:null,                 spd:.2},

function NV(){return NIGHTS[Math.min(5,Math.max(1,night))]}

function nextTk(first){const c=NV().tk;if(!c)return Infinity;return first?c[0]+Math.random()*(c[1]-c[0]):dist+c[2]+Math.random()*(c[3]-c[2])}

 if(k===0){const n=1+(Math.random()*c.spk|0);for(let i=0;i<n;i++)obs.push({t:'spike',x:spawnX+i*S,w:S,h:S})}

function btn(){const m=matchMedia('(pointer:coarse)').matches;return m?{x:W-210,y:H-150,w:180,h:120}:{x:W-150,y:H-110,w:120,h:80}}

 if(dist>=9000&&night>=5){localStorage.nsdNight=1;victory=true;started=false;gd=null;for(let i=0;i<5;i++)setTimeout(()=>tone(660+i*165,.3,'triangle',.25),i*200);return}

}

function drawBg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05020a');g.addColorStop(1,'#1a0d14');x.fillStyle=g;x.fillRect(0,0,W,H);
